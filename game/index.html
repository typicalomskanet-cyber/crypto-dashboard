<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0514" />
    <meta name="description" content="Chronicle of Devil Gods — 2.5D MMO action-RPG prototype." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Chronicle of Devil Gods</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0a0514; color: #d8c9b3; font-family: system-ui, sans-serif; overscroll-behavior: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(ellipse at center, #1b1425 0%, #0a0514 80%);
        z-index: 9999; transition: opacity 0.4s ease-out;
      }
      #boot.hide { opacity: 0; pointer-events: none; }
      #boot .ring {
        width: 64px; height: 64px; border-radius: 50%;
        background: radial-gradient(circle, #c8408a 0%, transparent 70%);
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      #boot .lbl {
        position: absolute; bottom: 22%;
        letter-spacing: 0.3em; font-size: 12px; color: #8a7a8a;
        text-transform: uppercase;
      }
      @keyframes bootpulse {
        0%, 100% { transform: scale(0.85); opacity: 0.5; }
        50% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div class="ring"></div><div class="lbl">Chronicle of Devil Gods</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide the boot splash once React has mounted something into #root.
      const boot = document.getElementById('boot');
      const root = document.getElementById('root');
      const obs = new MutationObserver(() => {
        if (root && root.firstChild) {
          boot && boot.classList.add('hide');
          setTimeout(() => boot && boot.remove(), 500);
          obs.disconnect();
        }
      });
      if (root) obs.observe(root, { childList: true });
      // Safety timeout — never leave the splash up forever.
      setTimeout(() => {
        if (boot && document.body.contains(boot)) {
          boot.classList.add('hide');
          setTimeout(() => boot.remove(), 500);
        }
      }, 8000);
    </script>
  </body>
</html>
